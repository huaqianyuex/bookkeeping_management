<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>从 Prompt 到 Harness · 封面</title>
<style>
  :root{
    --paper:#FBFBF8;
    --ink:#14161A;
    --pine:#0B5D4A;
    --pine-2:#1F6F5B;
    --pine-3:#3E8573;
    --gray:#6B7280;
    --rule:#DCDCD5;
    --rule-soft:#E7E7E0;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  html,body{margin:0;height:100%;background:#2A2D33;overflow:hidden}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--s,1));
    overflow:hidden;box-sizing:border-box;padding:80px;
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);text-wrap:pretty;
    -webkit-font-smoothing:antialiased;
  }
  .top-rule{height:1px;background:var(--ink)}
  .cols{
    display:grid;grid-template-columns:442px 1fr;column-gap:60px;
    height:calc(100% - 1px);position:relative;
  }
  .cols::after{
    content:"";position:absolute;left:472px;top:0;bottom:0;
    width:1px;background:var(--rule-soft);
  }

  /* ── 窄左栏：索引卡 ─────────────────────── */
  .idx{display:flex;flex-direction:column;justify-content:space-between;padding-top:44px}
  .bar{width:28px;height:3px;background:var(--pine);margin-bottom:20px}
  .kicker{
    font-size:15px;line-height:1.6;letter-spacing:.16em;
    color:var(--ink);font-weight:500;
  }
  .idx-foot .lab{
    font-size:13px;letter-spacing:.2em;color:var(--gray);
    line-height:1.4;margin-bottom:9px;
  }
  .idx-foot .val{
    font-size:15px;line-height:1.6;color:var(--ink);
    margin-bottom:22px;
  }
  .idx-foot .path{
    font-family:var(--serif);font-size:16px;line-height:1.5;
    letter-spacing:.01em;color:var(--ink);margin-bottom:7px;
  }
  .idx-foot .note{
    font-size:14px;line-height:1.7;color:var(--gray);
  }

  /* ── 宽右栏 ─────────────────────────────── */
  .body{display:flex;flex-direction:column;justify-content:space-between;padding-top:44px}
  .h1{
    margin:0;font-size:128px;font-weight:800;
    letter-spacing:-.02em;line-height:1.05;color:var(--ink);
  }
  .sub{
    margin:34px 0 0;font-size:22px;line-height:1.75;color:var(--gray);
  }

  .stages{border-top:1px solid var(--ink)}
  .srow{
    display:grid;grid-template-columns:64px 1fr auto;
    align-items:center;height:62px;
  }
  .srow + .srow{border-top:1px solid var(--rule)}
  .num{
    font-family:var(--serif);font-size:21px;line-height:1;
    letter-spacing:.04em;
  }
  .s1 .num{color:var(--pine);font-weight:700}
  .s2 .num{color:var(--pine-2);font-weight:700}
  .s3 .num{color:var(--pine-3);font-weight:600}
  .name{font-size:26px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
  .s1 .name{font-weight:700}
  .s2 .name{font-weight:600}
  .s3 .name{font-weight:500}
  .hex{
    font-family:var(--serif);font-size:17px;letter-spacing:.08em;
    color:var(--gray);
  }
</style>
</head>
<body>
<div id="stage">
  <div class="top-rule"></div>
  <div class="cols">

    <aside class="idx">
      <div class="idx-head">
        <div class="bar"></div>
        <div class="kicker">开源项目体检 · 工程化演进</div>
      </div>
      <div class="idx-foot">
        <div class="lab">项目</div>
        <div class="val">hechao_2024 / accounting-management-system —— 智能个人记账管理系统</div>
        <div class="lab">底本</div>
        <div class="path">docs/开源项目改进评估报告.md</div>
        <div class="note">逐项核对 README / .gitignore / git 历史与远程 / 依赖文件 / 目录结构 / docs / 代码注释</div>
      </div>
    </aside>

    <main class="body">
      <div class="lede">
        <h1 class="h1">从 Prompt<br>到 Harness</h1>
        <p class="sub">一次开源项目体检的三阶段工程化演进</p>
      </div>

      <div class="stages">
        <div class="srow s1">
          <span class="num">Ⅰ</span>
          <span class="name">Prompt 紫</span>
          <span class="hex">#7C3AED</span>
        </div>
        <div class="srow s2">
          <span class="num">Ⅱ</span>
          <span class="name">Context 绿</span>
          <span class="hex">#10B981</span>
        </div>
        <div class="srow s3">
          <span class="num">Ⅲ</span>
          <span class="name">Harness 橙</span>
          <span class="hex">#F59E0B</span>
        </div>
      </div>
    </main>

  </div>
</div>
<script>
  (function(){
    var fit=function(){
      var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
      document.getElementById('stage').style.setProperty('--s', s);
    };
    fit(); window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
