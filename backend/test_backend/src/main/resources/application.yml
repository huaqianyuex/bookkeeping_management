server:
  port: 8080
  address: 0.0.0.0   # 允许局域网访问（真机调试必须）

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_book?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# AI服务配置（personal-ledger Express后端地址）
ai:
  service:
    url: http://localhost:3001

app:
  upload:
    avatar-dir: uploads/avatars
    avatar-url-prefix: /uploads/avatars/
